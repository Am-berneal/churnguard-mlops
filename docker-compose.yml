# One command runs the whole stack:
#   docker compose up --build
# Dashboard -> http://localhost:8000   MLflow UI -> http://localhost:5000   API docs -> http://localhost:8000/docs
services:
  mlflow:
    build: .
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts
      --allowed-hosts "mlflow,mlflow:5000,localhost,localhost:5000,127.0.0.1:5000"
    user: root
    ports: ["5000:5000"]
    volumes: [mlflow-data:/mlflow]
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:5000/health"]
      interval: 5s
      retries: 20

  trainer:
    build: .
    command: python -m churn.pipeline --n-trials ${N_TRIALS:-20}
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
    volumes: [./data:/app/data]
    user: root
    depends_on:
      mlflow: {condition: service_healthy}

  api:
    build: .
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports: ["8000:8000"]
    volumes: [./data:/app/data]
    user: root
    depends_on:
      trainer: {condition: service_completed_successfully}

volumes:
  mlflow-data:
